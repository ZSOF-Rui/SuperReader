name: Site check

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/site-check.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/site-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Manifest and local assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check release manifest and local assets
        run: node scripts/check-site.mjs

name: Bug 报告
description: 报告安装、读卡、界面或站点问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue，并脱敏后再粘贴任何诊断文本。不要提交完整卡号、证件号、证件照、完整 APDU、密钥或签名文件。
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options:
        - Android 正式版
        - Android 预览版
        - Windows 测试版
        - 官网 / 文档
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 例如 1.7.1 (16) 或 1.8.0-preview3 (27)
      placeholder: 1.7.1 (16)
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      description: 手机型号、Android 版本；Windows 请写系统版本与读卡器型号
      placeholder: Pixel 7 / Android 15；或 Windows 11 23H2 / ACR122U
    validations:
      required: true
  - type: input
    id: card
    attributes:
      label: 卡片类型
      description: 交通卡、银行卡、证件或实验卡；不要写完整卡号
      placeholder: 交通联合 / 银联借记卡 / 电子护照
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 贴卡…
        3. 看到…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附脱敏后的截图或诊断文本；卡号只保留前 6 位
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认内容已脱敏，不包含完整卡号、证件号、证件照、密钥或他人数据。
          required: true
        - label: 我使用的是本人持有或已获授权的卡片。
          required: true
